# Tests replace inference only. No model downloads or paid API calls.
services:
  ollama:
    image: ghostshift-provider-fixture
    build:
      context: .
      target: fixture
    entrypoint: ["node", "provider.mjs"]
    volumes: !reset []
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:11434/api/tags').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  model-init:
    image: node:24-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    entrypoint: ["node", "-e", "process.exit(0)"]
    command: []
