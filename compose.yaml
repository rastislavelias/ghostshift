name: ghostshift

services:
  console:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${GHOSTSHIFT_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: ghostshift
      PGUSER: ghostshift
      PGPASSWORD: ${POSTGRES_PASSWORD:-ghostshift-local-only}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghostshift
      POSTGRES_USER: ghostshift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghostshift-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostshift -d ghostshift"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
